<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="OyunKafe ücretsiz online oyunlar. Araba, futbol ve parkour oyunlarını hemen oyna.">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#111827}
.header{
  background:linear-gradient(135deg,#111827,#1f2937);
  color:white;
  text-align:center;
  padding:20px 20px;
}

.header img{
  width:420px;
  max-width:90%;
  height:auto;
  display:block;
  margin:0 auto;
}
.container{width:92%;max-width:1150px;margin:28px auto}
.info{background:white;padding:18px;border-radius:16px;box-shadow:0 5px 18px rgba(0,0,0,.08);margin-bottom:22px}
.cats{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.cat{border:0;background:#e5e7eb;color:#111827;padding:9px 13px;border-radius:999px;cursor:pointer;font-weight:700}
.cat.active{background:#2563eb;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.09)}
.thumb{height:150px;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:900;color:white;text-align:center;padding:18px;background:linear-gradient(135deg,#2563eb,#7c3aed)}
.card-content{padding:15px}.card h3{margin:0 0 8px;font-size:19px}.card p{margin:0 0 13px;color:#4b5563;line-height:1.45;font-size:14px}
.tag{display:inline-block;background:#eff6ff;color:#1d4ed8;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;margin-bottom:10px}
.btn{border:0;background:#2563eb;color:white;padding:10px 15px;border-radius:10px;font-weight:800;cursor:pointer}
.game{display:none;background:white;padding:18px;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.09);margin-bottom:25px}
.game.active{display:block}
.game-top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:14px}
.back{border:0;background:#111827;color:white;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}
.frame{background:#000;border-radius:16px;overflow:hidden}
iframe{width:100%;height:680px;border:0;display:block}
.seo{margin-top:15px;color:#374151;line-height:1.6}
.footer{text-align:center;color:#6b7280;padding:30px;font-size:14px}
@media(max-width:700px){
  .header{
    padding:26px 14px;
  }

  .header img{
    width:360px;
    max-width:95%;
  }

  iframe{
    height:520px;
  }

  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>
<header class="header">
<img src="logo.png" alt="OyunKafe Logo">
</header>

<main class="container">
<section id="gameSection" class="game">
<div class="game-top">
<div>
<h2 id="gameTitle"></h2>
<p id="gameDesc"></p>
</div>
<button class="back" onclick="closeGame()">Oyunlara Dön</button>
</div>
<div class="frame"><iframe id="gameFrame" src="" allowfullscreen></iframe></div>
<div class="seo" id="gameSeo"></div>
</section>

<section id="homeSection">
<div class="info">
<h2>Popüler Oyunlar</h2>
<p>OyunKafe'de mobil ve bilgisayar uyumlu ücretsiz oyunları hemen oynayabilirsin.</p>
<div id="categories" class="cats"></div>
</div>
<div id="gamesGrid" class="grid"></div>
</section>
</main>

<footer class="footer">© 2026 OyunKafe - Ücretsiz Online Oyunlar</footer>

{id:"cut-the-rope",title:"Cut The Rope",category:"Zeka",embed:"https://html5.gamedistribution.com/24becac37a04406c8f6c44c28513c09c/?gd_sdk_referrer_url=https://oyunkafe.com/#cut-the-rope",description:"İpi kes ve şekeri hedefe ulaştır.",seo:"Cut The Rope ücretsiz bulmaca oyunu."}];

let activeCategory="Tümü";
function categories(){return ["Tümü",...new Set(games.map(g=>g.category))];}
function renderCategories(){document.getElementById("categories").innerHTML=categories().map(c=>`<button class="cat ${c===activeCategory?"active":""}" onclick="setCategory('${c}')">${c}</button>`).join("");}
function setCategory(c){activeCategory=c;renderCategories();renderGames();}
function renderGames(){const filtered=activeCategory==="Tümü"?games:games.filter(g=>g.category===activeCategory);document.getElementById("gamesGrid").innerHTML=filtered.map(g=>`<article class="card"><div class="thumb">${g.title}</div><div class="card-content"><span class="tag">${g.category}</span><h3>${g.title}</h3><p>${g.description}</p><button class="btn" onclick="openGame('${g.id}')">Oyna</button></div></article>`).join("");}
function openGame(id){const g=games.find(x=>x.id===id);if(!g)return;document.getElementById("gameTitle").textContent=g.title;document.getElementById("gameDesc").textContent=g.description;document.getElementById("gameSeo").textContent=g.seo;document.getElementById("gameFrame").src=g.embed;document.getElementById("gameSection").classList.add("active");document.getElementById("homeSection").style.display="none";window.scrollTo({top:0,behavior:"smooth"});}
function closeGame(){document.getElementById("gameFrame").src="";document.getElementById("gameSection").classList.remove("active");document.getElementById("homeSection").style.display="block";}
renderCategories();renderGames();
